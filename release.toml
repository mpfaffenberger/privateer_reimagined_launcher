# What a Privateer Reimagined release contains. See publisher/README.md.
#   set GAME_REPO=C:\Users\mpfaffenberger\code\new_privateer   (after building the game)
# One file for every platform (#66): `prl build --os macos --channel stable-macos` takes the
# sources marked macos plus the unmarked ones; the default is a Windows build on `stable`.
# Linux has two (#162): `linux` (x86_64, the Steam Deck) on `<channel>-linux` and
# `linux-arm64` on `<channel>-linux-arm64`, each built on its own arch.
product = "privateer-reimagined"

[launch]
windows = "new_privateer.exe"
macos = "new_privateer"
linux = "new_privateer"
linux-arm64 = "new_privateer"

[[source]]
os = "windows"
from = "${GAME_REPO}/build/new_privateer.exe"
to = "new_privateer.exe"

# The same path on every Unix: each build runs on a machine of its own platform.
[[source]]
os = ["macos", "linux", "linux-arm64"]
from = "${GAME_REPO}/build/new_privateer"
to = "new_privateer"

[[source]]
from = "${GAME_REPO}/assets"
to = "assets"
# Only files that are certainly never loaded at runtime. Trimming further (.obj/.3ds
# sources, raw captures, the legacy sprites/ atlases) needs a runtime-asset audit in the
# game repo first: excluding something the game loads would break installs.
exclude = [
  # 544 git symlinks: a by-speaker view of speech/original for humans. The game only
  # scans speech/original and speech/bar, and the links break wherever core.symlinks
  # is false (release 0.1.0 shipped them as 30-byte text files; #25).
  "speech/flight_by_speaker/**",
  "**/*.blend",
  "**/*.blend1",
  "**/.DS_Store",
  "**/Thumbs.db",
  "**/desktop.ini",
  # Runtime caches the game rebuilds from the .obj beside them (#118). It trusts a cache
  # only if it's newer than its .obj, which an install's file times don't guarantee, and
  # every rebuild has different bytes. A shipped cache therefore turns into a modified
  # release file once that ship loads, and the launcher offers the same version again.
  # Left out, the game owns them. (assets/debug's caches have no .obj: they ship.)
  "meshes/**/*.npmesh",
]
