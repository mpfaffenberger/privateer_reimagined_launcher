# What a Privateer Reimagined release contains. See publisher/README.md.
#   set GAME_REPO=C:\Users\mpfaffenberger\code\new_privateer   (after building the game)
# One file for every OS (#66): `prl build --os macos --channel stable-macos` takes the
# sources marked macos plus the unmarked ones; the default is a Windows build on `stable`.
product = "privateer-reimagined"

[launch]
windows = "new_privateer.exe"
macos = "new_privateer"

[[source]]
os = "windows"
from = "${GAME_REPO}/build/new_privateer.exe"
to = "new_privateer.exe"

[[source]]
os = "macos"
from = "${GAME_REPO}/build/new_privateer"
to = "new_privateer"

[[source]]
from = "${GAME_REPO}/assets"
to = "assets"
# Only files that are certainly never loaded at runtime. Trimming further (.obj/.3ds
# sources, raw captures, the legacy sprites/ atlases) needs a runtime-asset audit in the
# game repo first: excluding something the game loads would break installs.
exclude = [
  # 544 git symlinks: a by-speaker view of speech/original for humans. The game only
  # scans speech/original and speech/bar, and the links break wherever core.symlinks
  # is false (release 0.1.0 shipped them as 30-byte text files; #25).
  "speech/flight_by_speaker/**",
  "**/*.blend",
  "**/*.blend1",
  "**/.DS_Store",
  "**/Thumbs.db",
  "**/desktop.ini",
]
