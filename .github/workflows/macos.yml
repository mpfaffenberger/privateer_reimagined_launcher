# macOS: Rust tests + the launcher build (#66, #69).
#
# Windows is still built and released from Mike's machine; macOS can't be built from Windows,
# so it runs here. The .app is ad-hoc signed (no Apple Developer ID), so opening it needs
# System Settings > Privacy & Security > Open Anyway the first time.
# The artifact holds the .dmg (site download) and the .app.tar.gz the updater fetches. The
# updater signature is NOT made here: the updater key stays on Mike's machine, which signs
# the archive (tauri signer sign) before `prl upload-launcher --macos-archive`.
name: macos

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Rust tests (prl-core, launcher)
        run: cargo test -p prl-core -p privateer-launcher

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # app.js in a vm with stubbed Tauri calls (#88): no window, no dependencies.
      - name: Launcher UI tests
        run: node --test launcher/ui/app.test.mjs

      - name: Build the unsigned launcher (.app + .dmg)
        working-directory: launcher
        run: |
          npm ci
          npx tauri build --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}'

      # An unsigned app with a broken or partial signature gets "is damaged and can't be
      # opened" (no Open Anyway). Ad-hoc signing the whole bundle (signingIdentity "-") gives
      # the milder "could not verify" instead. Fail here if the seal isn't complete.
      - name: Check the app's ad-hoc signature covers the whole bundle
        run: |
          app="target/release/bundle/macos/Privateer Reimagined.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv "$app" 2>&1 | grep -E 'Signature=adhoc|Sealed Resources'

      # The updater's archive (tauri-plugin-updater's macOS install_inner): a .tar.gz whose
      # first path component is the .app. COPYFILE_DISABLE stops bsdtar adding ._ AppleDouble
      # entries, which would land inside the installed app.
      - name: Updater archive (.app.tar.gz)
        run: |
          version=$(node -p "require('./launcher/src-tauri/tauri.conf.json').version")
          archive="target/release/bundle/macos/Privateer Reimagined_${version}_aarch64.app.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$archive" -C target/release/bundle/macos "Privateer Reimagined.app"
          first=$(tar -tzf "$archive" | cut -d/ -f1 | sort -u)
          [[ "$first" == "Privateer Reimagined.app" ]] || { echo "unexpected top level: $first"; exit 1; }
          ! tar -tzf "$archive" | grep -q '/\._' || { echo "AppleDouble entries in the archive"; exit 1; }
          ls -l "$archive"

      - name: Upload the .dmg + updater archive
        uses: actions/upload-artifact@v4
        with:
          name: privateer-launcher-macos-arm64-${{ github.sha }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
          if-no-files-found: error
          retention-days: 14
