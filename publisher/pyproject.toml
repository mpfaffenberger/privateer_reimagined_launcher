[project]
name = "prl"
version = "0.1.0"
description = "Build, sign and publish Privateer Reimagined releases (content-addressed, delta-friendly)"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",          # R2 via its S3-compatible API
    "cryptography>=42",     # ed25519 manifest signing
    "zstandard>=0.22",      # blob compression
]

[project.scripts]
prl = "prl.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
