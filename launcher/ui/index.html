<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Privateer Reimagined</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <div class="layout">
  <!-- News from privateer-reimagined.com/launcher/ (#44). Sandboxed: no scripts, forms or top
       navigation, and no access to the launcher. New-window links go to the system browser. -->
  <aside class="news" aria-label="News">
    <iframe id="news-frame" title="News from Privateer Reimagined" sandbox="allow-same-origin allow-popups"
            referrerpolicy="no-referrer" hidden></iframe>
    <div id="news-fallback" class="news-fallback">
      <p class="eyebrow">Gemini Sector</p>
      <p class="dim">News from the project shows here when you're online.</p>
    </div>
  </aside>
  <main>
    <header>
      <p class="eyebrow">Gemini Sector &middot; 2669</p>
      <h1>Privateer <span>Reimagined</span></h1>
    </header>

    <section class="card" id="owner-card">
      <h2>Wing Commander: Privateer</h2>
      <p id="owner-status" class="dim">Looking for your copy&hellip;</p>
      <div class="row" id="owner-actions" hidden>
        <button id="browse-privateer" class="secondary">Choose folder&hellip;</button>
        <button id="get-gog" class="link">Get it on GOG</button>
      </div>
    </section>

    <section class="card" id="install-card">
      <h2>Game</h2>
      <p class="dim">Install folder: <span id="install-dir">&hellip;</span>
        <button id="change-dir" class="link">Change</button></p>
      <p id="update-status" class="dim">&nbsp;</p>
      <div class="progress" id="progress" hidden><div id="progress-bar"></div></div>
      <p id="progress-text" class="dim small">&nbsp;</p>
      <div class="row">
        <button id="primary" class="primary" disabled>Checking&hellip;</button>
        <button id="verify" class="secondary" disabled>Verify files</button>
      </div>
      <p id="error" class="error" hidden></p>
    </section>

    <footer class="dim small">A fan project, not affiliated with Electronic Arts. <span id="cdn"></span></footer>
  </main>
  </div>
</body>
</html>
