[package]
name = "privateer-launcher"
version = "0.2.0"
edition = "2021"
description = "Privateer Reimagined launcher"
publish = false

[lib]
name = "privateer_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
prl-core = { path = "../../crates/prl-core" }
# Same features as prl-core, so one TLS stack: the news panel's reachability check (#44).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync"] }
